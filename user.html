<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MathBaazi - Speed Math Arena</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #0b111e;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .neon-cyan {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
    }
    .card-gradient {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .gold-crown {
      color: #fbbf24;
      filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.5));
    }
    .blue-tick {
      color: #38bdf8;
    }
    /* Hide scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-4 left-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- App Header -->
  <header id="app-header" class="sticky top-0 z-40 bg-[#0b111e]/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2" onclick="navigateTo('home')">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-black text-lg">
        M
      </div>
      <div>
        <h1 class="text-base font-extrabold tracking-tight text-white flex items-center gap-1">
          MathBaazi
          <span class="text-[10px] bg-cyan-500/20 text-cyan-400 font-bold px-1.5 py-0.5 rounded">PRO</span>
        </h1>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <!-- Wallet Quick Pill -->
      <button onclick="navigateTo('wallet')" class="flex items-center gap-1.5 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 px-3 py-1.5 rounded-full text-xs font-bold text-white transition">
        <i data-lucide="wallet" class="w-3.5 h-3.5 text-cyan-400"></i>
        <span id="header-balance">₹0</span>
      </button>
      <!-- Notifications Icon -->
      <button onclick="navigateTo('notifications')" class="relative p-2 rounded-full bg-slate-800/60 hover:bg-slate-800 text-slate-300 transition">
        <i data-lucide="bell" class="w-4 h-4"></i>
        <span id="notif-badge" class="hidden absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
      </button>
      <!-- Profile -->
      <button onclick="navigateTo('profile')" class="w-8 h-8 rounded-full border border-cyan-500/40 overflow-hidden bg-slate-800 flex items-center justify-center">
        <img id="header-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Math" alt="Avatar" class="w-full h-full object-cover" />
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="main-content" class="px-4 py-3 max-w-lg mx-auto">
    <!-- Dynamic route content injected here -->
  </main>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 z-40 bg-[#0b111e]/95 backdrop-blur-lg border-t border-slate-800 max-w-lg mx-auto flex items-center justify-around py-2">
    <button onclick="navigateTo('home')" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400 text-[10px] font-bold" data-route="home">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span>Home</span>
    </button>
    <button onclick="navigateTo('wallet')" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400 text-[10px] font-bold" data-route="wallet">
      <i data-lucide="wallet" class="w-5 h-5"></i>
      <span>Wallet</span>
    </button>
    <button onclick="navigateTo('leaderboard')" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400 text-[10px] font-bold" data-route="leaderboard">
      <i data-lucide="trophy" class="w-5 h-5"></i>
      <span>Ranks</span>
    </button>
    <button onclick="navigateTo('match-history')" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400 text-[10px] font-bold" data-route="match-history">
      <i data-lucide="swords" class="w-5 h-5"></i>
      <span>Matches</span>
    </button>
    <button onclick="navigateTo('profile')" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400 text-[10px] font-bold" data-route="profile">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span>Profile</span>
    </button>
  </nav>

  <!-- Modal / Dialog Container -->
  <div id="modal-container" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"></div>

  <script>
    // -------------------------------------------------------------
    // SUPABASE CONFIGURATION
    // -------------------------------------------------------------
    const SUPABASE_URL = 'https://iwvauaueteocwsyuoioz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_zh5b1t_MEwLT4gCQj-NV2Q_QCF2lCKi';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let userProfile = null;

    // Toast helper
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColors = {
        success: 'bg-emerald-600 border-emerald-500 text-white',
        error: 'bg-rose-600 border-rose-500 text-white',
        warn: 'bg-amber-600 border-amber-500 text-white',
        info: 'bg-slate-800 border-cyan-500/50 text-cyan-200'
      };
      toast.className = `p-3.5 rounded-xl border shadow-lg text-xs font-semibold flex items-center justify-between pointer-events-auto transition-all transform duration-200 ${bgColors[type] || bgColors.info}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 200);
      }, 3500);
    }
    window.toast = showToast;

    // Format currency
    function fmt(amount) {
      const n = Number(amount) || 0;
      return '₹' + n.toLocaleString('en-IN');
    }

    // -------------------------------------------------------------
    // NATIVE ANDROID BRIDGE & PAYMENT CALLBACKS
    // -------------------------------------------------------------
    function openPaymentWebView(checkoutUrl, depositId) {
      if (window.AndroidBridge && window.AndroidBridge.openPayment) {
        window.AndroidBridge.openPayment(checkoutUrl, depositId);
      } else {
        window.open(checkoutUrl, '_blank');
      }
    }

    window.onPaymentResult = function(result) {
      console.log('Payment result callback:', result);
      if (result && result.success) {
        showToast('⏳ Verifying payment with gateway…', 'info');
        let attempts = 0;
        const poll = setInterval(async () => {
          attempts++;
          const { data: dep } = await supabaseClient
            .from('deposits')
            .select('status, amount')
            .eq('id', result.depositId)
            .single();

          if (dep?.status === 'SUCCESS' || dep?.status === 'COMPLETED') {
            clearInterval(poll);
            showToast(`✅ Payment of ₹${dep.amount} credited!`, 'success');
            await loadUserProfile();
            navigateTo('wallet');
          } else if (dep?.status === 'FAILED') {
            clearInterval(poll);
            showToast('❌ Payment verification failed.', 'error');
          } else if (attempts >= 15) {
            clearInterval(poll);
            showToast('⏳ Payment is being verified. Check transactions shortly.', 'info');
            navigateTo('wallet');
          }
        }, 2000);
      } else {
        showToast('Payment cancelled or incomplete: ' + (result?.message || 'Cancelled'), 'warn');
      }
    };

    // -------------------------------------------------------------
    // ROUTING ENGINE
    // -------------------------------------------------------------
    function navigateTo(route) {
      window.location.hash = `#/${route}`;
    }

    window.addEventListener('hashchange', handleRoute);

    async function handleRoute() {
      const hash = window.location.hash || '#/home';
      const route = hash.replace('#/', '').split('?')[0];

      // Update bottom nav active style
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.getAttribute('data-route') === route) {
          btn.classList.add('text-cyan-400');
          btn.classList.remove('text-slate-400');
        } else {
          btn.classList.remove('text-cyan-400');
          btn.classList.add('text-slate-400');
        }
      });

      const main = document.getElementById('main-content');

      switch (route) {
        case 'wallet':
          main.innerHTML = await renderWalletScreen();
          break;
        case 'deposit':
          main.innerHTML = await renderDepositScreen();
          break;
        case 'withdraw':
          main.innerHTML = await renderWithdrawScreen();
          break;
        case 'transactions':
          main.innerHTML = await renderTransactionsScreen();
          break;
        case 'match-history':
          main.innerHTML = await renderMatchHistoryScreen();
          break;
        case 'leaderboard':
          main.innerHTML = await renderLeaderboardScreen();
          break;
        case 'notifications':
          main.innerHTML = await renderNotificationsScreen();
          break;
        case 'profile':
          main.innerHTML = await renderProfileScreen();
          break;
        case 'settings':
          main.innerHTML = await renderSettingsScreen();
          break;
        case 'home':
        default:
          main.innerHTML = await renderHomeScreen();
          break;
      }

      lucide.createIcons();
    }

    // -------------------------------------------------------------
    // USER PROFILE & AUTH LOAD
    // -------------------------------------------------------------
    async function loadUserProfile() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        // Not authenticated — redirect to login instead of using a fake demo user
        currentUser = null;
        navigateTo('login');
        return;
      } else {
        currentUser = user;
      }

      const { data: profile } = await supabaseClient
        .from('users')
        .select('*')
        .eq('id', currentUser.id)
        .maybeSingle();

      userProfile = profile || {
        id: currentUser.id,
        display_name: currentUser.email?.split('@')[0] || 'SpeedSolver',
        wallet_balance: 250,
        locked_balance: 0,
        total_deposited: 500,
        total_withdrawn: 100,
        total_winnings: 450,
        rank: 'Gold I',
        mmr: 1420,
        xp: 3200,
        wins: 48,
        matches_played: 65,
        is_verified: true,
        has_gold_crown: true,
        vip_tier: 'VIP Gold'
      };

      document.getElementById('header-balance').innerText = fmt(userProfile.wallet_balance);
      if (userProfile.photo_url) {
        document.getElementById('header-avatar').src = userProfile.photo_url;
      }
    }

    // -------------------------------------------------------------
    // FEATURE 1: WALLET SCREEN
    // -------------------------------------------------------------
    async function renderWalletScreen() {
      await loadUserProfile();
      return `
        <div class="space-y-4 animate-fade-in">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-black text-white">Wallet & Balances</h2>
            <button onclick="navigateTo('transactions')" class="text-xs text-cyan-400 font-bold hover:underline flex items-center gap-1">
              History <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <!-- Main Balance Card -->
          <div class="card-gradient p-5 rounded-2xl relative overflow-hidden neon-cyan">
            <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl"></div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Available Balance</p>
            <div class="mt-1 flex items-baseline gap-2">
              <h1 class="text-3xl font-black text-white">${fmt(userProfile.wallet_balance)}</h1>
              <span class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full">Active</span>
            </div>
            ${userProfile.locked_balance > 0 ? `
              <div class="mt-3 flex items-center gap-1.5 text-xs text-amber-300 bg-amber-500/10 border border-amber-500/20 px-3 py-1.5 rounded-lg w-fit">
                <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                <span>${fmt(userProfile.locked_balance)} locked in ongoing matches</span>
              </div>
            ` : ''}

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-3 mt-6">
              <button onclick="navigateTo('deposit')" class="flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-extrabold py-3 rounded-xl shadow-lg transition active:scale-95 text-sm">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                Add Money
              </button>
              <button onclick="navigateTo('withdraw')" class="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 text-white font-bold py-3 rounded-xl transition active:scale-95 text-sm">
                <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                Withdraw
              </button>
            </div>
          </div>

          <!-- Lifetime Stats Grid -->
          <div class="card-gradient p-4 rounded-2xl">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Lifetime Breakdown</h3>
            <div class="grid grid-cols-3 gap-2 text-center">
              <div class="bg-slate-800/40 p-3 rounded-xl border border-slate-800">
                <p class="text-[10px] text-slate-400 font-semibold">Total Deposited</p>
                <p class="text-sm font-bold text-white mt-1">${fmt(userProfile.total_deposited)}</p>
              </div>
              <div class="bg-slate-800/40 p-3 rounded-xl border border-slate-800">
                <p class="text-[10px] text-slate-400 font-semibold">Total Winnings</p>
                <p class="text-sm font-bold text-emerald-400 mt-1">${fmt(userProfile.total_winnings)}</p>
              </div>
              <div class="bg-slate-800/40 p-3 rounded-xl border border-slate-800">
                <p class="text-[10px] text-slate-400 font-semibold">Total Withdrawn</p>
                <p class="text-sm font-bold text-slate-300 mt-1">${fmt(userProfile.total_withdrawn)}</p>
              </div>
            </div>
          </div>

          <!-- Security Badge -->
          <div class="flex items-center justify-center gap-2 text-slate-500 text-xs py-2">
            <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i>
            <span>100% Secure Encrypted UPI & Bank Transactions</span>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------
    // FEATURE 2: DEPOSIT FLOW (WEBVIEW PAYMENT)
    // -------------------------------------------------------------
    async function renderDepositScreen() {
      await loadUserProfile();
      return `
        <div class="space-y-4 animate-fade-in">
          <div class="flex items-center gap-2">
            <button onclick="navigateTo('wallet')" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </button>
            <h2 class="text-lg font-black text-white">Add Money to Wallet</h2>
          </div>

          <!-- Current Balance Info -->
          <div class="card-gradient p-3.5 rounded-xl flex items-center justify-between">
            <span class="text-xs text-slate-400">Current Balance</span>
            <span class="text-sm font-black text-white">${fmt(userProfile.wallet_balance)}</span>
          </div>

          <!-- Preset Chips -->
          <div class="card-gradient p-4 rounded-2xl space-y-3">
            <label class="text-xs font-bold text-slate-300">Quick Select Amount</label>
            <div class="grid grid-cols-3 gap-2">
              ${[50, 100, 250, 500, 1000, 2000].map(amt => `
                <button onclick="selectDepositAmount(${amt})" class="dep-chip bg-slate-800/80 hover:bg-slate-800 border border-slate-700 hover:border-cyan-500 text-white font-extrabold py-2.5 rounded-xl text-sm transition" data-amt="${amt}">
                  ₹${amt}
                </button>
              `).join('')}
            </div>

            <!-- Custom Input -->
            <div class="pt-2">
              <label class="text-xs text-slate-400 mb-1 block">Or enter custom amount (₹10 - ₹2,00,000)</label>
              <div class="relative">
                <span class="absolute left-3.5 top-3 text-cyan-400 font-extrabold text-base">₹</span>
                <input id="deposit-amount-input" type="number" min="10" max="200000" value="100" class="w-full bg-slate-900/90 border border-slate-700 focus:border-cyan-500 rounded-xl py-2.5 pl-8 pr-4 text-white font-bold text-base focus:outline-none" />
              </div>
            </div>
          </div>

          <!-- Gateway Method Selection -->
          <div class="card-gradient p-4 rounded-2xl space-y-2">
            <label class="text-xs font-bold text-slate-300">Payment Gateway</label>
            <div class="flex items-center justify-between p-3 rounded-xl bg-cyan-950/20 border border-cyan-500/40">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-cyan-500/20 flex items-center justify-center text-cyan-400 font-black text-xs">
                  UPI
                </div>
                <div>
                  <p class="text-xs font-bold text-white">ZapUPI Instant Gateway</p>
                  <p class="text-[10px] text-slate-400">GPay, PhonePe, Paytm, BHIM & NetBanking</p>
                </div>
              </div>
              <i data-lucide="check-circle-2" class="w-5 h-5 text-cyan-400"></i>
            </div>
          </div>

          <!-- Proceed Button -->
          <button id="btn-proceed-pay" onclick="handleDepositSubmit()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-extrabold py-3.5 rounded-xl shadow-lg transition active:scale-95 text-base flex items-center justify-center gap-2">
            <i data-lucide="zap" class="w-5 h-5"></i>
            <span>PROCEED TO PAY</span>
          </button>
        </div>
      `;
    }

    function selectDepositAmount(amt) {
      document.getElementById('deposit-amount-input').value = amt;
      document.querySelectorAll('.dep-chip').forEach(btn => {
        if (Number(btn.getAttribute('data-amt')) === amt) {
          btn.classList.add('border-cyan-400', 'bg-cyan-500/20');
        } else {
          btn.classList.remove('border-cyan-400', 'bg-cyan-500/20');
        }
      });
    }

    async function handleDepositSubmit() {
      const input = document.getElementById('deposit-amount-input');
      const amount = Number(input.value);
      const btn = document.getElementById('btn-proceed-pay');

      if (!amount || amount < 10) {
        showToast('Minimum deposit is ₹10', 'error');
        return;
      }
      if (amount > 200000) {
        showToast('Maximum deposit is ₹2,00,000', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Initializing Payment…`;
      lucide.createIcons();

      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) {
          showToast('Please login first', 'error');
          navigateTo('login');
          return;
        }
        const userId = user.id;
        // Use display_name from profile if available, fall back to email
        const userName = userProfile?.display_name || user.email || userId;

        // 1. Create deposit record (PENDING) — user_name is required by RLS
        const { data: deposit, error: depErr } = await supabaseClient
          .from('deposits')
          .insert({
            user_id: userId,
            user_name: userName,
            amount: amount,
            gateway: 'zapupi',
            status: 'PENDING'
          })
          .select()
          .single();

        if (depErr) throw new Error(depErr.message);

        // 2. Call Supabase Edge Function to create ZapUPI order
        const { data, error } = await supabaseClient.functions.invoke('create-deposit-order', {
          body: {
            deposit_id: deposit.id,
            amount: amount,
            currency: 'INR'
          }
        });

        if (error || !data?.success) {
          throw new Error(data?.error || error?.message || 'Payment gateway not available');
        }

        const checkoutUrl = data.checkout_url;
        if (!checkoutUrl) throw new Error('No checkout URL received from gateway');

        showToast('🚀 Opening checkout in secure WebView…', 'info');
        openPaymentWebView(checkoutUrl, deposit.id);

      } catch (err) {
        showToast('Deposit error: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="zap" class="w-5 h-5"></i> PROCEED TO PAY`;
        lucide.createIcons();
      }
    }

    // -------------------------------------------------------------
    // FEATURE 3: WITHDRAWAL FLOW
    // -------------------------------------------------------------
    async function renderWithdrawScreen() {
      await loadUserProfile();
      return `
        <div class="space-y-4 animate-fade-in">
          <div class="flex items-center gap-2">
            <button onclick="navigateTo('wallet')" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </button>
            <h2 class="text-lg font-black text-white">Withdraw Funds</h2>
          </div>

          <div class="card-gradient p-4 rounded-2xl flex items-center justify-between">
            <div>
              <p class="text-xs text-slate-400 font-semibold">Available for Withdrawal</p>
              <p class="text-2xl font-black text-emerald-400 mt-0.5">${fmt(userProfile.wallet_balance)}</p>
            </div>
            <div class="text-right text-[11px] text-slate-400">
              <p>Min: ₹50</p>
              <p>Max: ₹25,000</p>
            </div>
          </div>

          <div class="card-gradient p-4 rounded-2xl space-y-4">
            <div>
              <label class="text-xs text-slate-300 font-bold block mb-1">Withdrawal Amount</label>
              <div class="relative">
                <span class="absolute left-3.5 top-3 text-cyan-400 font-extrabold text-base">₹</span>
                <input id="withdraw-amount" type="number" min="50" max="25000" placeholder="Enter amount" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 pl-8 pr-4 text-white font-bold text-base focus:border-cyan-500 focus:outline-none" />
              </div>
            </div>

            <div>
              <label class="text-xs text-slate-300 font-bold block mb-1">Payment Method</label>
              <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center gap-2 p-3 bg-slate-800/80 rounded-xl border border-slate-700 cursor-pointer">
                  <input type="radio" name="wd-method" value="UPI" checked class="text-cyan-500 focus:ring-0" />
                  <span class="text-xs font-bold text-white">UPI ID</span>
                </label>
                <label class="flex items-center gap-2 p-3 bg-slate-800/80 rounded-xl border border-slate-700 cursor-pointer">
                  <input type="radio" name="wd-method" value="Bank Transfer" class="text-cyan-500 focus:ring-0" />
                  <span class="text-xs font-bold text-white">Bank Account</span>
                </label>
              </div>
            </div>

            <div>
              <label class="text-xs text-slate-300 font-bold block mb-1">Account Reference / UPI ID</label>

          <button id="btn-submit-wd" onclick="submitWithdrawal()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-extrabold py-3.5 rounded-xl shadow-lg transition active:scale-95 text-sm flex items-center justify-center gap-2">

    async function submitWithdrawal() {
      const amount = Number(document.getElementById('withdraw-amount').value);
      const method = document.querySelector('input[name="wd-method"]:checked')?.value || 'UPI';
      const account = document.getElementById('withdraw-account').value.trim();

      if (!amount || amount < 50) {
        showToast('Minimum withdrawal is ₹50', 'error');
        return;
      }
      if (amount > 25000) {
        showToast('Maximum withdrawal is ₹25,000 per request', 'error');
        return;
      }
      if (amount > userProfile.wallet_balance) {
        showToast('Insufficient wallet balance', 'error');
        return;
      }
      if (!account) {
        showToast('Please enter your UPI ID or bank account details', 'error');
        return;
      }

      const btn = document.getElementById('btn-submit-wd');
      btn.disabled = true;

      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const userId = user ? user.id : (currentUser ? currentUser.id : 'demo-user');

        const { error } = await supabaseClient
          .from('withdrawals')
          .insert({
            user_id: userId,
            user_name: user?.email || userProfile.display_name,
            amount: amount,
            method: method,
            reference: account,
            status: 'PENDING'
          });

        if (error) throw error;

        showToast('✅ Withdrawal request submitted! Processing soon.', 'success');
        navigateTo('wallet');
      } catch (err) {
        showToast('Withdrawal failed: ' + err.message, 'error');
        btn.disabled = false;
      }
    }
